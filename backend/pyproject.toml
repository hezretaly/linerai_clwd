[project]
name = "liner-backend"
version = "0.1.0"
description = "Liner AI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    # Both live providers. Neither is imported at startup -- a missing package
    # must surface as a typed 503 naming the setting, not an ImportError.
    # 1.68 is the floor that has client.responses -- an older release resolves
    # fine and then AttributeErrors on the first live turn.
    "openai>=1.68",
    "anthropic>=0.40",
    # ADF uploads are untrusted XML. stdlib ElementTree is still open to
    # entity-expansion DoS ("billion laughs"); defusedxml closes it.
    "defusedxml>=0.7.1",
    # The Twilio media bridge is a WebSocket *client* -- this process dials
    # OpenAI Realtime, rather than being dialled. uvicorn[standard] happens to
    # pull this in for its own server side, and relying on that is how a build
    # breaks the day uvicorn switches to wsproto. Declared because it is a
    # dependency of ours.
    "websockets>=12",
    # The server's database. One Postgres, a database per dealer group and one
    # for Liner's own; SQLite stays the default on a laptop, so nothing
    # imports this until a `postgresql+psycopg://` URL is configured.
    "psycopg[binary]>=3.2",
    # Schema changes as migrations, run at boot against every database this
    # process serves. `create_all` adds a table but never a column, which is
    # the whole reason several features here are tables that should have been
    # columns; a migration can do both.
    "alembic>=1.13",
    # HTML in email, both directions: a rep's formatted message is cleaned to
    # an allowlist before it is sent, and a buyer's HTML is cleaned before a
    # rep's browser draws it. The Rust ammonia sanitiser; bleach, the usual
    # answer, stopped being maintained in 2026 and says so on its own page.
    "nh3>=0.3.7",
]

[project.optional-dependencies]
# Verification tooling only -- the app never launches a browser. `make install`
# pulls this so `make shots` and `make e2e` work on a fresh clone.
dev = ["playwright>=1.55"]

[tool.setuptools.packages.find]
include = ["app*"]
