[project]
name = "liner-backend"
version = "0.1.0"
description = "Liner AI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "anthropic>=0.40",
]

[tool.setuptools.packages.find]
include = ["app*"]
