# Craig and Landreth Cars -- a real dealership, for a booked demo.
#
# Everything here was read off their own pages: the header address block and
# the schema.org AutoDealer block agree, and the hours and copy come from their
# home page. Nothing is inferred, with one stated exception -- the brand accent
# below, which was read off a screenshot by eye because nothing here can reach
# their site.
#
# This one file is the whole dealership: who they are, when they open, what
# their storefront says, where their cars come from, and who works there.
# `DEALERSHIP=craigandlandreth` is the only line `.env` needs.

name: Craig and Landreth Cars

# The St. Matthews store. Their site lists three lots on one page; which one
# this instance is comes from `inventory.dealer_id` further down.
timezone: America/Kentucky/Louisville
address: 4156 Shelbyville Rd., Louisville, KY 40207
phone: 502-447-3450
website_url: "https://www.craigandlandrethcars.com/"

# From the "Our Hours" table on their own home page. Note Friday and Saturday
# close an hour earlier than Mon-Thu -- worth keeping exact rather than
# rounding to one range, because `check_availability` builds the slots it
# offers a buyer straight out of these values, and a 7:30 PM slot on a Friday
# is an appointment nobody is there for.
hours:
  monday:    { open: "09:00", close: "20:00" }
  tuesday:   { open: "09:00", close: "20:00" }
  wednesday: { open: "09:00", close: "20:00" }
  thursday:  { open: "09:00", close: "20:00" }
  friday:    { open: "09:00", close: "19:00" }
  saturday:  { open: "09:00", close: "19:00" }
  sunday:    null   # closed

# Their livery. Only the accent family moves -- every structural token still
# comes from the one theme layer, so their colour cannot restyle the product
# into something that no longer reads.
brand:
  # Read off the screenshot of their own home page by eye, not sampled -- the
  # egress proxy refuses their site and their image CDN, so nothing here could
  # fetch either. If it is off, this one line is the fix.
  accent: "#f26a21"
  accent_ink: "#ffffff"
  # Their site is orange on near-black, and an orange accent on a white page
  # looks nothing like it. Read ONLY by /showroom -- the storefront is theirs,
  # and their reps' dashboard is a working tool that should not change colour
  # because a prospect's marketing site is dark.
  surface: dark
  logo_url: "https://imagescdn.dealercarsearch.com/DealerImages/1123/20820/logow2.png"

# Their front page, as `/showroom` renders it. Every string below is theirs,
# copied from their own home page -- their headings, their sentences, their
# links. It lives here rather than in Showroom.tsx for the same reason their
# name does: a prospect's copy written into a component is the next instance
# greeting somebody as Craig and Landreth.
#
# The links point at their real site on purpose. A nav that 404s inside our
# app during a demo is worse than one that leaves it, and these are pages we
# are not pretending to have rebuilt.
site:
  tagline: Your Premier Car Dealership In Louisville, KY
  heading: Welcome To Craig and Landreth Cars
  hero_image: "https://imagescdn.dealercarsearch.com/DealerImages/1123/20820/50yrslide4.jpg"
  welcome:
    - >-
      Let Craig and Landreth Cars show you how easy it is to buy a quality used
      car in Louisville. We believe fair prices, superior service, and treating
      customers right leads to satisfied repeat buyers.
    - >-
      Our friendly and knowledgeable sales staff is here to help you find the
      car you deserve, priced to fit your budget. Shop our virtual showroom
      online then stop by for a test drive.
  links:
    - { label: Inventory,     href: "https://www.craigandlandrethcars.com/inventory" }
    - { label: We Buy Cars,   href: "https://www.craigandlandrethcars.com/webuycars" }
    - { label: Financing,     href: "https://www.craigandlandrethcars.com/financing" }
    - { label: Services,      href: "https://www.craigandlandrethcars.com/services" }
    - { label: Our Store,     href: "https://www.craigandlandrethcars.com/ourstore" }
  social:
    - { label: Facebook, href: "https://www.facebook.com/Craigandlandrethcars" }
    - { label: X,        href: "https://x.com/CnLcars" }
    - { label: YouTube,  href: "https://www.youtube.com/@CandLUsedCarsKY" }

# No `showroom_fixture` here, deliberately. Riverside's fourteen vehicles, its
# sample CSV lot and its populated yesterday are invented for a demo of a
# dealership that does not exist -- seeded here they would put a Toyota Sienna
# from Cedar Falls, Iowa in front of a Louisville buyer. Their lot comes from
# their own site, below.

# Where their cars come from. Facts about this dealership, so they live here
# rather than in `.env` -- switching DEALERSHIP= to another prospect and
# forgetting to change a SCRAPER_ line crawled Craig's site into somebody
# else's instance, silently, because a successful crawl of the wrong site
# looks exactly like a successful crawl.
#
# Press Import on /app/inventory, review the run, then publish.
inventory:
  source_url: "https://www.craigsbestcars.com/newandusedcars"
  # Their listing page mixes three stores -- Louisville (1123), Clarksville IN
  # (1129) and Bullitt County (3833) -- each card carrying its own id. This app
  # holds exactly one dealership, so without this Liner offers a buyer a car
  # that is a two-hour drive from the showroom it says it is standing in.
  dealer_id: "1123"

# Their people, so a reseed rebuilds them. `make add-user` adds somebody to a
# live box without one; this is the other half, so a prospect's own manager
# does not disappear the next time the fixture is rebuilt.
#
# Each gets a generated password, printed once by the seed. Only `manager` and
# `rep` -- our own accounts are in `ops_users` and never come from here.
staff:
  - { name: Austin, email: austin@craigandlandrethcars.com, role: manager }

# Their own answers, quoted verbatim to a buyer and never composed -- which is
# why this list is empty rather than borrowed. Riverside's doc fee is $189 and
# its deposit $500 refundable; both are invented, and Liner repeating them here
# would quote a real customer a policy nobody at this dealership has agreed to.
# With no entry `answer_from_knowledge` returns found: false and a rep picks it
# up, which is the honest answer to a question we do not know.
#
# Fill these in from them -- their site, or the questions they ask in the demo:
#
# knowledge:
#   - topic: Doc fee
#     answer: "..."
#   - topic: Trade-ins
#     answer: "..."
knowledge: []
