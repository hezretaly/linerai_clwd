# Alsbou Motors -- https://www.alsboucars.com/
#
# Santa Ana, CA. Their colours, copy, logo, nav and lot below all come from a
# capture of their own site, supplied rather than crawled: the egress proxy
# answers 403 to CONNECT for www.alsboucars.com:443, so nothing on this
# machine has ever read their pages.
#
# Their hours came from the dealership directly; everything else below is
# from the capture. This profile seeds.
#

name: Alsbou Motors

# The Santa Ana store. They have a sister site at alsboumotorsriverside.com,
# which is a DIFFERENT dealership as far as this app is concerned -- one
# instance holds one lot, and appointments are booked at the address below.
# Riverside is linked in the nav rather than merged into this inventory.
timezone: America/Los_Angeles
address: 1223 W 17th St, Santa Ana, CA 92706
phone: (951) 366-4755
website_url: "https://www.alsboucars.com/"

# Mon-Sat 10-8, Sun 10-6. Open seven days, so there is no `null` here -- and
# Sunday's earlier close is kept exact rather than rounded into the others,
# because `check_availability` builds the slots Liner offers a buyer straight
# out of these values. Flattened to one range, a buyer would be offered 7:30
# on a Sunday and arrive at a locked door.
hours:
  monday:    { open: "10:00", close: "20:00" }
  tuesday:   { open: "10:00", close: "20:00" }
  wednesday: { open: "10:00", close: "20:00" }
  thursday:  { open: "10:00", close: "20:00" }
  friday:    { open: "10:00", close: "20:00" }
  saturday:  { open: "10:00", close: "20:00" }
  sunday:    { open: "10:00", close: "18:00" }

# Their livery, read from the theme config embedded in their own pages rather
# than sampled off a screenshot -- so unlike Craig and Landreth's accent,
# these are exact.
brand:
  accent: "#bf933d"        # Gold/bronze. Buttons, prices, links, active states.
  accent_ink: "#ffffff"    # White text on the gold.
  # `light`, NOT `dark`, and that is a judgement rather than an oversight.
  # Their header and footer are black (#000000) and their nav bar dark grey
  # (#424242), but the page between them is white with a near-white body --
  # the chrome is dark, the surface is not. Craig and Landreth are `dark`
  # because their *whole page* is orange on near-black. Setting `dark` here
  # would produce a storefront that looks nothing like theirs.
  surface: light
  # ...but the chrome IS dark, and it is the first thing anybody names about
  # their site: a dark grey (#424242) contact strip over a black (#000000) nav
  # with white text, and the same black again in the footer. `chrome: dark`
  # says exactly that -- the header, the strip and the footer take the dark
  # palette, the page between them stays white.
  #
  # Two words rather than the two hex values above, deliberately: this picks
  # the palette already in `liner-theme.css` instead of carrying #000000 into
  # a stylesheet, so their file cannot restyle the product into something
  # unreadable. Only the accent family ever travels as a colour.
  chrome: dark
  logo_url: "https://gmacrmprod.s3.us-west-2.amazonaws.com/media/ey/website/178898223075480.webp"

# Their front page, in their own words, copied from their About Us card.
#
# Every href is absolute and points at their real site on purpose. A relative
# `/inventory` would resolve against *our* host and 404 inside the app during
# a demo, which is worse than a link that honestly leaves it -- these are
# pages we are not pretending to have rebuilt. The two dropdown items in
# their nav (FINANCING, DEALER SERVICES) are `#` on their own site and so are
# not links at all; they are left out rather than rendered as dead ones.
#
# THREE THINGS FROM THEIR PAGES ARE DELIBERATELY NOT HERE:
#
#   * Their footer's body-style shortcuts (`?bodystyle=SUV`, `SEDAN`,
#     `CONVERTIBLE`, `WAGON`). Their export carries no body style, so every one
#     of them would return an empty grid -- the same reason the By Type row is
#     not drawn for this lot at all. Their *make* shortcuts are not here either,
#     and for the opposite reason: the storefront counts makes from rows and
#     offers them as real filters, which is better than a link that leaves.
#   * "I WANT THIS CAR" and "GET PRE-APPROVED" on each card, and the Capital One
#     pre-qualification widget beside them. Those are forms, and a form that
#     posts nowhere is the one thing this codebase will not build. The assistant
#     is what stands in their place: the card's button opens it asking about
#     that exact car, which is the same intent answered now rather than on
#     Monday. Pre-qualification stays a link to their own site, above.
#   * A `font-family`. Their captured markup sets none -- it is in a stylesheet
#     that was not in the dump -- so the storefront keeps the product's type
#     rather than guessing at theirs. A wrong typeface is more obviously wrong
#     to them than a neutral one.
site:
  tagline: Quality Used Cars in Santa Ana, CA
  heading: Welcome to Alsbou Motors
  # What they call the number on a card. Their word, not ours -- a dealer
  # reading their own storefront notices the label before the layout.
  price_label: Advertised price
  # Their card headlines a total and discloses what is inside it. WHICH fees
  # apply varies per car -- their four electric vehicles pay no smog fee, so
  # those four are $100 over the advertised price where the other 65 are
  # $158.25 -- which is why this is a sentence they wrote rather than a
  # schedule this app adds up. The two figures on the card are both stated by
  # their export; nothing subtracts one from the other to invent a third.
  price_note: >-
    Advertised price plus DOC $85, Transfer Charge $15, and Smog $50 with a
    $8.25 certificate where the vehicle needs one.
  # The photograph across the top of their front page. ONE image, not five --
  # the five below are a different thing entirely and were wrongly rotated
  # here before, which put their financing advert where a picture of the
  # forecourt belongs.
  hero_image: "https://gmacrmprod.s3.us-west-2.amazonaws.com/media/ey/website/178898222720193.webp"
  # The strip of five linked images under it, in their page's order, each
  # going somewhere different. Every one is hotlinked from their CDN and each
  # falls back on its own: an image host that refuses an off-site referrer, a
  # URL that has moved and a venue firewall all look identical and all happen
  # on somebody else's laptop, and a row of torn-page icons across their own
  # front page is the failure to prevent. NONE of these has ever loaded on
  # this machine -- the egress proxy refuses
  # gmacrmprod.s3.us-west-2.amazonaws.com -- so what has been seen here is the
  # fallback, and the images themselves are unproven.
  #
  # The labels are ours, because their images carry the words and a blank
  # `alt` on five links is five links a screen reader cannot tell apart.
  banners:
    - { label: Browse the inventory, href: "https://www.alsboucars.com/inventory",              image: "https://gmacrmprod.s3.us-west-2.amazonaws.com/media/ey/website/178898222872312.webp" }
    - { label: Financing,            href: "https://www.alsboucars.com/financing",              image: "https://gmacrmprod.s3.us-west-2.amazonaws.com/media/ey/website/178898222830147.webp" }
    - { label: Trade in or sell,     href: "https://www.alsboucars.com/page/trade-sell",        image: "https://gmacrmprod.s3.us-west-2.amazonaws.com/media/ey/website/178898222859470.webp" }
    - { label: Contact us,           href: "https://www.alsboucars.com/contact",                image: "https://gmacrmprod.s3.us-west-2.amazonaws.com/media/ey/website/178898222842083.webp" }
    - { label: Riverside inventory,  href: "https://www.alsboumotorsriverside.com/inventory",   image: "https://gmacrmprod.s3.us-west-2.amazonaws.com/media/ey/website/178898222838840.webp" }
  # "Explore Vehicles By Body Style": four pictures on their front page, each
  # leading to their inventory narrowed to that style. The images are on an
  # Elfsight CDN rather than theirs, and every one falls back to its word.
  # `style` names the value in the export's `bodyType` column -- their PICKUP
  # tile narrows to `truck`, which is what they export -- and a tile is drawn
  # only where the lot holds that style, counted.
  body_style_tiles:
    - { label: Coupe,  style: coupe, image: "https://files.elfsightcdn.com/eafe4a4d-3436-495d-b748-5bdce62d911d/9e1b9247-3a3d-42f2-b751-001e4eccec2f/coupe.webp" }
    - { label: Sedan,  style: sedan, image: "https://files.elfsightcdn.com/eafe4a4d-3436-495d-b748-5bdce62d911d/2c237929-8a19-4ff7-8ab4-93fc8ad51369/sedan-1-.webp" }
    - { label: SUV,    style: suv,   image: "https://files.elfsightcdn.com/eafe4a4d-3436-495d-b748-5bdce62d911d/2cb90799-7cba-4aa3-b024-3ff3fcdd8109/suv-1-.webp" }
    - { label: Pickup, style: truck, image: "https://files.elfsightcdn.com/eafe4a4d-3436-495d-b748-5bdce62d911d/7b311738-83a1-4e13-97e3-58d7bfd8b179/pickup-1-.webp" }
  # The two full-width bands their front page runs between its sections:
  # financing above the About copy, trade-in below it. Their pages, on their
  # host, for the reason the nav links are. Each carries the desktop image;
  # their page swaps a portrait one in under 768px, and a single picture
  # scaling is the honest version of that rather than a second URL to keep
  # in step.
  promos:
    - { label: Financing at Alsbou Motors, href: "https://www.alsboucars.com/financing",       image: "https://gmacrmprod.s3.us-west-2.amazonaws.com/media/ey/website/178898222852898.webp" }
    - { label: Trade in or sell your car,  href: "https://www.alsboucars.com/page/trade-sell", image: "https://gmacrmprod.s3.us-west-2.amazonaws.com/media/ey/website/178898222913549.webp" }
  # The lead paragraph of their About card. The three subheaded blocks that
  # follow it are `sections:` below -- run together as four plain paragraphs,
  # which is how this read before, their About section stops looking like
  # theirs and reads as one undifferentiated column.
  welcome:
    - >-
      At Alsbou Motors, located at 1223 W 17th St, Santa Ana, CA, we pride
      ourselves on being your premier destination for quality used cars. Our
      dealership specializes in offering a diverse selection of the best used
      cars in Santa Ana, CA, ensuring that every customer finds the perfect
      vehicle to meet their needs.
  # The three subheaded blocks that follow it, word for word off their page.
  # They were previously here as bare paragraphs with their second halves cut
  # off, which lost both the headings and about a third of each sentence --
  # this is the dealership's own copy, and an abridged version of it is
  # something they did not write.
  sections:
    - heading: Your Trusted Source for Used Cars
      body: >-
        With years of experience in the automotive industry, Alsbou Motors is
        committed to providing exceptional service and a seamless car-buying
        experience. Our knowledgeable staff is here to guide you through our
        extensive inventory of used cars for sale in Santa Ana, CA, helping
        you make an informed decision.
    - heading: Quality and Affordability
      body: >-
        We understand that purchasing a vehicle is a significant investment.
        That's why we focus on offering the best used cars in Santa Ana, CA,
        at competitive prices. Each vehicle undergoes a thorough inspection to
        ensure it meets our high standards of quality and reliability.
    - heading: Visit Us Today!
      body: >-
        Discover why Alsbou Motors is the go-to dealership for used cars in
        Santa Ana, CA. Visit us today and let us help you find your next
        vehicle!
  # Their nav, in their order. DEALER SERVICES is the one item left out: on
  # their own site it is `href="#"` opening a dropdown, so there is no page to
  # send anybody to and a dead link on their storefront is worse than one item
  # fewer. FINANCING is `#` in the nav too, but their footer and their banner
  # strip both point at /financing, so that is a real page and it is used.
  links:
    - { label: Home,                href: "https://www.alsboucars.com/" }
    - { label: Inventory,           href: "https://www.alsboucars.com/inventory" }
    - { label: Financing,           href: "https://www.alsboucars.com/financing" }
    - { label: Get Pre-Qualified,   href: "https://www.alsboucars.com/prequalified" }
    - { label: Reviews,             href: "https://www.alsboucars.com/page/reviews" }
    - { label: Contact Us,          href: "https://www.alsboucars.com/contact" }
    - { label: Riverside Inventory, href: "https://www.alsboumotorsriverside.com/inventory" }
  # The one nav item they emphasise. It is in `links` above like every other,
  # and this names it so the page can draw it in the accent *in its own
  # position* -- moved out of the list to be appended at the end, it rendered
  # sixth where their nav has it third, which is a different nav.
  #
  # Their footer sells it harder still ("Bad Credit Car Loans"), and it is
  # THEIR page, on their host: pre-qualification is a credit decision, so a
  # button here that stayed inside this app would be a form posting nowhere.
  cta: { label: Get Pre-Qualified, href: "https://www.alsboucars.com/prequalified" }
  # None found in their markup. Left empty rather than invented -- a social
  # link that goes nowhere is worse on their own storefront than none at all.
  social: []

# Their lot: 69 vehicles, committed so `make reset-db` rebuilds it with no
# network at all -- which is the only option here, since their site refuses
# this machine.
#
# WHERE THE COLUMNS CAME FROM. The first version of this file was built from
# a CSV that carried no mileage and no body style, and said so -- "worth
# asking them for a fuller export". They did not need to send one: their own
# inventory page already publishes both, along with fuel, drivetrain,
# transmission, the two colours, the engine, the stock number, the advertised
# price before fees and a link to each car's history report. Every one of
# those is now in the file below, read from the page rather than guessed at,
# which is the difference between a card that says "2018 Audi Q7" and the
# card their own site draws.
#
# STILL EMPTY, AND DELIBERATELY: `seats` and `features`. Their page states
# neither. Door count is not seat count and an engine description is not a
# feature list, so the two `search_inventory` filters that read those narrow
# nothing here -- a missing field is a smaller error than an invented one.
#
# One car is call-for-price (a 2020 Nissan Pathfinder). That is a listing
# state, not a gap: it sorts last rather than first, and the buyer gets an
# enquiry link on the card instead of a number in a sentence.
inventory:
  fixture_csv: "alsbou/inventory.csv"
  # For when a crawl becomes possible from a machine that can reach them. It
  # is NOT Dealer Car Search -- their pages are served by gma.to / GMACRM, so
  # the existing adapter does not apply and a capture is needed first. Until
  # then the CSV above is the lot.
  source_url: "https://www.alsboucars.com/inventory"
  # Single store in this feed, so nothing to narrow. Riverside is a separate
  # site and deliberately not merged in.
  dealer_id: ""

# No `showroom_fixture`, deliberately, and the gate checks for it. Riverside
# Auto's fourteen invented cars, its sample CSV lot and its $189 doc fee are a
# fixture for a dealership that does not exist; seeded here they would put a
# Toyota Sienna from Cedar Falls, Iowa in front of a Santa Ana buyer.

# `manager` is the senior role a dealership has, and it is deliberately not
# `owner`. `owner` exists, but it means *us* -- it lives in `ops_users`, signs
# in at /login?as=owner and opens /ops, which is Liner's own demo calendar and
# our mail. Putting a dealership's address there would hand an outside company
# the inside of our company, which is the whole reason the two tables are
# separate. `profile.staff()` drops the role rather than honouring it, so this
# cannot be done by accident from a profile file either.
#
# A manager gets what their owner actually wants: the team page, the
# assignment roster, the Liner setup page and publishing the assistant's
# instructions. A rep gets none of those.
#
# NOTE the address is `alsbou.com`, while their site is `alsboucars.com`. Kept
# as given -- for a sign-in it is an identifier and a demo account does not
# need a reachable mailbox, and `OUTBOUND_ONLY_TO` refuses mail to it anyway.
# Worth correcting before they use it for real, since a rep's signature and
# any Reply-To would carry it.
#
# The password is generated and printed once by the seed, like every profile's
# own people -- an environment variable per person is one somebody has to add
# to the deployment. To choose one instead:
#   make set-password EMAIL=owner@alsbou.com
staff:
  - { name: Alsbou Owner, email: owner@alsbou.com, role: manager }
  # TO FILL -- their real reps. Placeholders so the floor has a shape: a
  # roster of one has nobody to hand a buyer to, so assignment, the per-rep
  # queues and the team page have nothing to show. `@placeholder.invalid`
  # cannot resolve or receive mail, so a wrong name is visibly wrong rather
  # than quietly plausible.
  - { name: Sales Rep One, email: rep1@placeholder.invalid, role: rep }
  - { name: Sales Rep Two, email: rep2@placeholder.invalid, role: rep }
  - { name: Sales Rep Three, email: rep3@placeholder.invalid, role: rep }

# What Liner knows beyond the listings. EMPTY ON PURPOSE.
#
# `answer_from_knowledge` returns an answer **word for word** -- never
# summarised, never composed -- because a policy answer is one a buyer repeats
# back to a rep. Nothing here has been told to us, so Liner says a colleague
# will confirm and the buyer lands in Needs a person, which is correct.
#
# With this list empty the two chips that promise an answer are not drawn:
# "What's your doc fee?" as a button that produces "I'll have to check" is a
# question the dealership is asking on its own behalf and cannot answer.
#
# ASK THEM. Each is a question a buyer asks in the first five minutes, and
# today each one costs a rep a phone call. Their site advertises financing and
# "Bad Credit Car Loans" prominently, so the financing one is the first to get.
#
# - topic: Financing
#   answer: "..."        # They push "GET PRE-QUALIFIED" and bad-credit loans.
# - topic: Doc fee
#   answer: "..."
# - topic: Trade-ins
#   answer: "..."
# - topic: Deposits
#   answer: "..."
# - topic: Warranty
#   answer: "..."
# - topic: Test drives
#   answer: "..."
# - topic: Vehicle history
#   answer: "..."
# - topic: Mileage
#   answer: "..."        # Their export carries none, so this is the gap a
#                        # buyer will hit first. Worth a written answer until
#                        # a fuller export arrives.
#
# Hours and the address are deliberately NOT here. They are on the dealership
# row and reach the prompt from `hours_json`; a second copy in this table is a
# second thing to change when they open later on a Saturday.
