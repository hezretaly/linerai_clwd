name = "liner-inbound-email"
main = "worker.js"
compatibility_date = "2026-01-01"

# postal-mime is a plain npm dependency; `npm i postal-mime` in this directory
# before `wrangler deploy`.
[build]
command = ""

# CRM_WEBHOOK_URL and WEBHOOK_SECRET are secrets, not vars -- WEBHOOK_SECRET is
# the only thing standing in front of an endpoint that writes into a buyer's
# history, and `vars` land in plaintext in the dashboard and in git.
#
#   wrangler secret put CRM_WEBHOOK_URL
#   wrangler secret put WEBHOOK_SECRET
#
# WEBHOOK_SECRET must equal the backend's. They are compared with a constant
# time check, so a mismatch fails identically to any other wrong value -- the
# receipts on /app/email are where you find out.
