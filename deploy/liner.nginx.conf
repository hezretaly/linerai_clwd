# nginx site for Liner AI. Copy to /etc/nginx/sites-available/liner,
# symlink into sites-enabled, then `nginx -t && systemctl reload nginx`.
#
# There is one proxy_pass and no try_files, on purpose. The routing rule the
# site needs -- `/` is the landing document, /chat /call /login /app/* are the
# SPA, everything else is a real file or a 404 -- lives in the app
# (backend/app/static.py), because that is the only place it can be kept in
# step with the frontend. Splitting it across an nginx config as well means two
# copies that drift, and when they drift `/` silently serves a blank page.
#
# Replace liner.example.com with your hostname before enabling.

upstream liner_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name liner.example.com;

    # certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name liner.example.com;

    ssl_certificate     /etc/letsencrypt/live/liner.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/liner.example.com/privkey.pem;

    # The session cookie is set Secure when ENV=production, so the app is
    # unusable over plain HTTP. That is deliberate -- it fails loudly rather
    # than sending a dealer's session in the clear.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ADF drops and inventory CSVs are uploads. nginx defaults to 1 MB, which
    # would 413 before the app's own size check ever ran.
    client_max_body_size 8m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames -- safe to cache hard. Everything else is revalidated.
    location /assets/ {
        proxy_pass http://liner_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The dealer event socket. Without the Upgrade headers the dashboard falls
    # back to its 2s reconnect loop and never updates live.
    location /ws/ {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A dealer leaves the dashboard open all day and events are bursty.
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Buyer chat streams over SSE; buffering would hold every token until
        # the reply finished, which reads as the assistant hanging.
        proxy_buffering off;
    }
}
