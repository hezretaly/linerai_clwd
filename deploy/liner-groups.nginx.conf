# nginx for the server that holds the dealer groups: alsbou.linerai.us,
# craigandlandreth.linerai.us, riverside.linerai.us -- and the next one, with
# no change here. Copy to /etc/nginx/sites-available/liner-groups, symlink
# into sites-enabled, then `nginx -t && systemctl reload nginx`.
# The runbook is docs/DEPLOY.md, "Several dealer groups on their own server".
#
# **One wildcard name and one proxy_pass.** The app picks the store from the
# Host header (STORE_DOMAIN=linerai.us), exactly as it picks one from a path
# prefix, so nginx names no dealership: a group is a profile file, a DNS
# record and a Worker line, never an edit to this file. The routing rule is
# the app's for the reason liner.nginx.conf gives -- two copies drift.
#
# **Behind Cloudflare, with an Origin CA certificate.** The records are
# proxied (orange cloud) and SSL/TLS is Full (strict). Origin CA is what makes
# the wildcard simple: issued in the Cloudflare dashboard for `*.linerai.us`
# and `linerai.us`, valid for up to fifteen years, no DNS challenge and no
# certbot. Browsers do not trust it and do not need to -- only Cloudflare
# connects to this box. (A Let's Encrypt wildcard works too, but only by
# DNS-01, which means an API token on this box that can edit the zone.)
#
# nginx 1.19.4 or later, for `ssl_reject_handshake`. No `http2` on purpose:
# Cloudflare talks HTTP/1.1 to an origin unless told otherwise, and the
# directive's spelling changed in 1.25 -- one fewer line to break `nginx -t`.

upstream liner_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# **Anything that is not one of ours gets nothing.** A scanner on the bare IP,
# or a stale record somebody else points here, would otherwise be answered by
# whichever server block nginx reads first -- which is a dealership's. 444
# closes the connection without a response; `ssl_reject_handshake` refuses
# TLS before a certificate is shown, so the box does not announce whose
# certificate it holds.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name *.linerai.us;
    # Cloudflare connects on 443 under Full (strict); this only answers a
    # request that bypassed it.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # One label. `linerai.us` itself is Liner's own and served by the other
    # box; a name that is not a group is answered here by the app with a 404
    # that says so -- never with some other dealership's store.
    server_name *.linerai.us;

    ssl_certificate     /etc/ssl/cloudflare/linerai.us.pem;
    ssl_certificate_key /etc/ssl/cloudflare/linerai.us.key;

    # The session cookie is Secure under ENV=production, so nobody stays
    # signed in over plain HTTP -- deliberate, as on the single-host config.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploads and received mail: an attachment is up to 15 MB and the Worker
    # posts a whole message as it arrived (up to Cloudflare's 25 MiB). nginx's
    # 1 MB default would 413 before the app's own, smaller limits ran.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames -- safe to cache hard. Everything else is revalidated.
    location /assets/ {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The dealer event socket. Without the Upgrade headers the dashboard falls
    # back to its 2s reconnect loop and never updates live.
    location /ws/ {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The Host header *is* the store here. Dropped, every request would
        # arrive for nobody's store.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A dealer leaves the dashboard open all day and events are bursty.
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Buyer chat streams over SSE; buffering would hold every token until
        # the reply finished, which reads as the assistant hanging.
        proxy_buffering off;
    }
}
