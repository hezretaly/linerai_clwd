# For the box that keeps linerai.us once the dealer groups have moved to their
# own server (docs/DEPLOY.md, "Several dealer groups on their own server").
# Include it inside that box's `server { listen 443 ... }` block, above
# `location /`:
#
#     sudo cp deploy/liner-groups-moved.conf /etc/nginx/snippets/
#     # in /etc/nginx/sites-available/liner, in the 443 server block:
#     include /etc/nginx/snippets/liner-groups-moved.conf;
#     sudo nginx -t && sudo systemctl reload nginx
#
# **Name every group that moved, in both places below, and nothing else.** A
# group left off keeps being served from this box's stale copy of it -- an
# answer that looks right and writes to a database nobody reads any more. A
# group named here that has *not* moved is worse: its every address goes to a
# subdomain nothing answers. Alsbou is the only one that has; the next is
# added to both alternations when it goes (`alsbou|craigandlandreth`).
#
# **Every address a group ever had keeps working.** A bookmark, an emailed
# application link (`/alsbou/r/<token>`), a car's page a buyer saved, the
# website chat tag on the dealer's own site: each is answered at the same path
# on the group's subdomain, query string kept. 308 rather than 301, so a POST
# stays a POST -- a 301 lets the browser turn it into a GET.
#
# Permanent, so browsers cache it: apply it once the group server is checked,
# not while you are still deciding.

location ~ ^/(?<moved_group>alsbou)(/.*)?$ {
    # The website chat's loader asks for its settings under the group's path
    # from the dealer's own page -- cross-origin, and a redirect the browser
    # may not read is a failed fetch. The loader then moves the chat to where
    # the settings say it lives (`frame_origin`).
    add_header Access-Control-Allow-Origin "*" always;
    # The rest of the address as it was *sent*, not as nginx decoded it for
    # matching: `%20` put back into a Location header decoded is a space.
    if ($request_uri ~ "^/[^/?]+(?<moved_rest>.*)$") {
        return 308 https://$moved_group.linerai.us$moved_rest;
    }
}

# The chat frame's own address names the group in its second segment.
location ~ ^/widget/(?<moved_frame>alsbou)(/.*)?$ {
    return 308 https://$moved_frame.linerai.us$request_uri;
}

# Only if the store this box answers *unprefixed* is the one that moved
# (`make to-postgres ARGS="--default-as alsbou"`): its pages and its emailed
# links go with it. `/login`, `/ops`, `/api` and `/` stay -- they are Liner's
# own sign-in, dashboard, mail intake and landing page. Not while the
# unprefixed store is a group still served here.
