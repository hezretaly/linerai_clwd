# Step one of two. Plain HTTP, no certificate referenced.
#
# liner.nginx.conf names certificate files, and nginx refuses to load a config
# whose ssl_certificate does not exist -- so applying it before certbot has run
# fails `nginx -t` with "cannot load certificate ... No such file or directory".
# certbot needs a working HTTP vhost to answer its challenge on. Chicken, egg.
#
# So: enable this one, get the certificate, then swap in the full config.
#
#   sudo cp deploy/liner-bootstrap.nginx.conf /etc/nginx/sites-available/liner
#   sudo sed -i 's/liner.example.com/YOUR-HOST/g' /etc/nginx/sites-available/liner
#   sudo ln -sfn /etc/nginx/sites-available/liner /etc/nginx/sites-enabled/liner
#   sudo nginx -t && sudo systemctl reload nginx
#   # the site is now live over HTTP -- check it, then:
#   sudo certbot --nginx -d YOUR-HOST
#
# The site is fully usable at this point except for signing in: the session
# cookie is Secure under ENV=production, so the browser will not send it back
# over plain HTTP. The landing page and /chat work; /login will not stick until
# the certificate is in place. That is the intended failure -- it refuses to put
# a dealer's session on the wire in the clear rather than quietly downgrading.

server {
    listen 80;
    listen [::]:80;
    server_name liner.example.com;

    client_max_body_size 8m;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
