# nginx for the server that holds everything: linerai.us and its www, each
# dealership's subdomain (alsbou.linerai.us), and demo.linerai.us. Two app
# processes behind it -- production on 8000, the demo on 8001 -- told apart
# by hostname here and by nothing else. The runbook is docs/NEW-SERVER.md.
#
#   sudo cp deploy/linerai.nginx.conf /etc/nginx/sites-available/linerai
#   sudo ln -sfn /etc/nginx/sites-available/linerai /etc/nginx/sites-enabled/linerai
#   sudo rm -f /etc/nginx/sites-enabled/default   # it claims default_server too
#   sudo nginx -t && sudo systemctl reload nginx
#
# **A dealership is never named here except where it moved.** The production
# app picks the store from the Host header (STORE_DOMAIN=linerai.us), so a new
# dealership is a profile, a DNS record and a Worker line -- never an edit to
# this file. `alsbou` appears once, below, for the addresses it had on
# linerai.us before it had a subdomain.
#
# **Behind Cloudflare, with an Origin CA certificate** for `*.linerai.us` and
# `linerai.us`: records proxied (orange cloud), SSL/TLS Full (strict). Only
# Cloudflare connects here, and it trusts its own Origin CA.
#
# nginx 1.19.4 or later, for `ssl_reject_handshake`. No `http2`: Cloudflare
# talks HTTP/1.1 to an origin, and the directive's spelling changed in 1.25.

upstream liner_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream liner_demo {
    server 127.0.0.1:8001;
    keepalive 8;
}

# **Anything that is not one of ours gets nothing.** A scanner on the bare IP
# would otherwise be answered by whichever block nginx read first -- a
# dealership's. 444 closes the connection; `ssl_reject_handshake` refuses TLS
# before a certificate is shown.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

# Cloudflare connects on 443 under Full (strict); this answers only a request
# that bypassed it.
server {
    listen 80;
    listen [::]:80;
    server_name linerai.us *.linerai.us;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.linerai.us;
    ssl_certificate     /etc/ssl/cloudflare/linerai.us.pem;
    ssl_certificate_key /etc/ssl/cloudflare/linerai.us.key;
    return 301 https://linerai.us$request_uri;
}

# ---------------------------------------------------------------- linerai.us
#
# Liner's own: the landing page, /login, /ops, /api (the marketing forms and
# the mail intake the Worker posts to), /embed.js. Production, port 8000.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name linerai.us;

    ssl_certificate     /etc/ssl/cloudflare/linerai.us.pem;
    ssl_certificate_key /etc/ssl/cloudflare/linerai.us.key;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # A received message is posted whole (up to Cloudflare's 25 MiB) and an
    # attachment is up to 15 MB; nginx's 1 MB default would 413 first.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # **Alsbou's addresses from before it had a subdomain** -- a website chat
    # tag pasted as `linerai.us/alsbou/embed.js`, a bookmark, a saved car
    # page -- are answered at the same path on alsbou.linerai.us, query kept.
    # 308 so a POST stays a POST. The loader asks for its settings here from
    # the dealer's own page, cross-origin, so the redirect carries CORS or it
    # is a failed fetch; the loader then moves the chat to `frame_origin`.
    # The path as it was *sent*: `%20` put back into a Location decoded is a
    # space. Name a dealership here only if it had linerai.us/<it>/ addresses.
    location ~ ^/(?<moved_group>alsbou)(/.*)?$ {
        add_header Access-Control-Allow-Origin "*" always;
        if ($request_uri ~ "^/[^/?]+(?<moved_rest>.*)$") {
            return 308 https://$moved_group.linerai.us$moved_rest;
        }
    }
    location ~ ^/widget/(?<moved_frame>alsbou)(/.*)?$ {
        return 308 https://$moved_frame.linerai.us$request_uri;
    }

    # **Everything a demo store had on linerai.us is on the demo now**: the
    # landing page's "Test the chat" (`/chat`), the unprefixed dashboard,
    # call, storefront and emailed links, and the demo stores by path. 307 --
    # temporary, because which store the landing page shows is a choice, and
    # method-preserving for the chat's POSTs. Before the unprefixed rule, so
    # `/widget/<demo store>` is not caught by it first.
    location ~ ^/(craigandlandreth|riverside)(/.*)?$ {
        add_header Access-Control-Allow-Origin "*" always;
        return 307 https://demo.linerai.us$request_uri;
    }
    location ~ ^/(app|chat|call|showroom|widget)(/.*)?$ {
        return 307 https://demo.linerai.us$request_uri;
    }
    location ^~ /r/ {
        return 307 https://demo.linerai.us$request_uri;
    }

    # Hashed filenames -- safe to cache hard.
    location /assets/ {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The /ops event socket and the phone line's media stream.
    location /ws/ {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}

# ----------------------------------------------------------- demo.linerai.us
#
# The demo instance, port 8001, stores by path: /craigandlandreth/...,
# and the Riverside fixture unprefixed. An exact name, so it wins over the
# wildcard below -- a demo request can never reach production's process.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name demo.linerai.us;

    ssl_certificate     /etc/ssl/cloudflare/linerai.us.pem;
    ssl_certificate_key /etc/ssl/cloudflare/linerai.us.key;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The marketing page and Liner's own dashboard are linerai.us's. The demo
    # process would serve its own copies, and an /ops here is a second,
    # empty one nobody should sign in to.
    location = / {
        return 302 https://linerai.us/;
    }
    location ^~ /ops {
        return 302 https://linerai.us$request_uri;
    }

    location /assets/ {
        proxy_pass http://liner_demo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The dealer socket, unprefixed and under a store's path
    # (`/craigandlandreth/ws/dealer`). Stores here are paths, so the second
    # form is the one a demo dashboard opens -- without the Upgrade headers
    # it 404s and the dashboard never updates live.
    location /ws/ {
        proxy_pass http://liner_demo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
    location ~ ^/[^/]+/ws/ {
        proxy_pass http://liner_demo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://liner_demo;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
}

# ------------------------------------------------- <dealership>.linerai.us
#
# Every dealership's subdomain, production, port 8000. The Host header *is*
# the store; a name that is no dealership's is answered by the app with a 404
# that says so, never with some other dealership's store.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name *.linerai.us;

    ssl_certificate     /etc/ssl/cloudflare/linerai.us.pem;
    ssl_certificate_key /etc/ssl/cloudflare/linerai.us.key;

    # The session cookie is Secure under ENV=production, so nobody stays
    # signed in over plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The dealer event socket. Without the Upgrade headers the dashboard falls
    # back to its 2s reconnect loop and never updates live.
    location /ws/ {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # The Host header *is* the store here. Dropped, every request would
        # arrive for nobody's store.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Buyer chat streams over SSE; buffering would hold every token until
        # the reply finished, which reads as the assistant hanging.
        proxy_buffering off;
    }
}
