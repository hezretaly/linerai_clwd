# A Liner vhost for an nginx you already run.
#
# Use this instead of liner.nginx.conf when the box already has an nginx
# terminating TLS for other sites -- including one inside a Docker container.
# It assumes the certificate already exists and does not try to obtain one.
#
# Edit two things: LINER_UPSTREAM (below) and every YOUR-HOST.
#
# ---------------------------------------------------------------------------
# Picking the upstream address
#
# If this nginx runs on the host, 127.0.0.1:8000 is correct and nothing else
# needs changing.
#
# If this nginx runs in a *container*, 127.0.0.1 is the container itself, and
# a proxy_pass there gives a 502 with nothing useful in the log. Use the Docker
# bridge gateway for the network the container is on:
#
#   docker inspect <container> \
#     --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} gw={{$v.Gateway}}{{"\n"}}{{end}}'
#
# and bind uvicorn to that same address, via a systemd drop-in so a git pull
# cannot clobber it -- /etc/systemd/system/liner.service.d/override.conf:
#
#   [Service]
#   ExecStart=
#   ExecStart=/srv/liner/backend/.venv/bin/uvicorn app.main:app \
#       --host 172.19.0.1 --port 8000 \
#       --proxy-headers --forwarded-allow-ips 172.19.0.0/16
#
# The gateway address is stable until the Docker network is recreated. If that
# happens, uvicorn fails to start with "Cannot assign requested address" -- a
# loud failure, and the fix is re-reading the gateway and updating both files.
# ---------------------------------------------------------------------------

upstream liner_app {
    server 172.19.0.1:8000;   # LINER_UPSTREAM -- see above
    keepalive 16;
}

server {
    listen 80;
    server_name YOUR-HOST www.YOUR-HOST;

    # Keep this first so certificate renewal keeps working.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://YOUR-HOST$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.YOUR-HOST;
    ssl_certificate     /etc/letsencrypt/live/YOUR-HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-HOST/privkey.pem;
    return 301 https://YOUR-HOST$request_uri;
}

server {
    listen 443 ssl;
    server_name YOUR-HOST;

    ssl_certificate     /etc/letsencrypt/live/YOUR-HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR-HOST/privkey.pem;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    # ADF drops and inventory CSVs are uploads. nginx defaults to 1 MB, which
    # would 413 before the app's own size check ever ran.
    client_max_body_size 8m;

    # Hashed filenames -- safe to cache hard.
    location /assets/ {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The dealer event socket. Without the Upgrade headers the dashboard falls
    # back to its 2s reconnect loop and never updates live.
    location /ws/ {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A dealer leaves the dashboard open all day and events are bursty.
        proxy_read_timeout 1h;
    }

    # Everything else -- landing page, SPA, API -- is one process. The routing
    # rule lives in backend/app/static.py, so there is no try_files here.
    location / {
        proxy_pass http://liner_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Buyer chat streams over SSE; buffering holds every token until the
        # reply finishes, which reads as the assistant hanging.
        proxy_buffering off;
    }
}
