<script src="conv-data.js"></script>
<script>
/* ============================================================
   Icons
   ============================================================ */
const ICON = {
  chat:  '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>',
  voice: '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a3 3 0 00-3 3v6a3 3 0 006 0V5a3 3 0 00-3-3z"/><path d="M19 10v1a7 7 0 01-14 0v-1"/><path d="M12 18v4M8 22h8"/></svg>',
  email: '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>',
  phone: '<svg class="h-3.5 w-3.5 shrink-0 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.13.96.36 1.9.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0122 16.92z"/></svg>',
  mail:  '<svg class="h-3.5 w-3.5 shrink-0 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>',
  globe: '<svg class="h-3.5 w-3.5 shrink-0 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M2 12h20M12 3a15 15 0 010 18 15 15 0 010-18z"/></svg>',
  car:   '<svg class="h-5 w-5 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12l2-5a2 2 0 012-1h10a2 2 0 012 1l2 5"/><rect x="2" y="12" width="20" height="7" rx="2"/><circle cx="7" cy="19" r="1.3"/><circle cx="17" cy="19" r="1.3"/></svg>',
  pencil:'<svg class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  lock:  '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>',
  alert: '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>',
  check: '<svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6L9 17l-5-5"/></svg>',
  box:   '<svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-5a2 2 0 012-1h10a2 2 0 012 1l2 5"/><rect x="2" y="12" width="20" height="7" rx="2"/></svg>'
};

const TAG = {
  destructive: 'border-destructive/30 bg-destructive/10 text-destructive',
  warning:     'border-warning/30 bg-warning/10 text-warning',
  success:     'border-success/30 bg-success/10 text-success',
  live:        'border-transparent bg-success text-success-foreground',
  muted:       'border-border text-muted-foreground'
};

const CHAN_STYLE = {
  chat:  'bg-muted text-foreground',
  voice: 'bg-primary/10 text-primary',
  email: 'bg-warning/10 text-warning'
};

/* provenance — a typed name and an inferred one are not the same fact */
const PROV = {
  typed:        { label: 'typed',      soft: false },
  marketplace:  { label: 'from listing', soft: false },
  'caller-id':  { label: 'caller ID',  soft: false },
  inferred:     { label: 'inferred',   soft: true }
};

/* ============================================================
   State
   ============================================================ */
let activeId = 'tara';
let takenOver = false;

/* ============================================================
   List pane
   ============================================================ */
function renderFilters() {
  const flagged = CONVERSATIONS.filter(c => c.state === 'flagged').length;
  const live    = CONVERSATIONS.filter(c => c.state === 'live').length;
  const items = [
    ['Needs a person', flagged, 'flag'],
    ['All', CONVERSATIONS.length, 'on'],
    ['Live', live, ''],
    ['Unclaimed', 4, ''],
    ['Mine', 2, '']
  ];
  document.getElementById('filters').innerHTML = items.map(function (f) {
    const base = 'inline-flex items-center gap-1.5 rounded-md border px-2.5 py-1 text-xs font-medium transition-colors';
    let cls;
    if (f[2] === 'flag') cls = base + ' border-destructive/30 bg-destructive/10 text-destructive hover:bg-destructive/15';
    else if (f[2] === 'on') cls = base + ' border-foreground bg-foreground text-background';
    else cls = base + ' border-input bg-background text-muted-foreground hover:bg-accent hover:text-accent-foreground';
    return '<button class="' + cls + '">' + f[0] + '<span class="tnum opacity-70">' + f[1] + '</span></button>';
  }).join('');
}

function renderList() {
  const groups = ['Needs a person', 'Live now', 'Earlier today'];
  let html = '';

  groups.forEach(function (g) {
    const rows = CONVERSATIONS.filter(c => c.group === g);
    if (!rows.length) return;

    html += '<div class="sticky top-0 z-10 border-b border-border bg-muted/60 px-4 py-1.5 text-xs font-medium text-muted-foreground backdrop-blur">' + g + '</div>';

    rows.forEach(function (c) {
      const isActive = c.id === activeId;
      const accent = c.state === 'flagged' ? 'before:bg-destructive'
                   : c.state === 'live'    ? 'before:bg-success'
                   : 'before:bg-transparent';
      const activeCls = isActive ? 'bg-muted' : 'hover:bg-muted/50';

      html +=
        '<button onclick="select(\'' + c.id + '\')" class="relative flex w-full gap-3 border-b border-border px-4 py-3 text-left transition-colors ' +
          activeCls + ' before:absolute before:inset-y-0 before:left-0 before:w-[3px] ' + accent + '">' +
          '<span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md ' + CHAN_STYLE[c.channel] + '">' + ICON[c.channel] + '</span>' +
          '<span class="min-w-0 flex-1">' +
            '<span class="mb-0.5 flex items-center gap-1.5">' +
              '<span class="truncate text-sm font-medium">' + c.name + '</span>' +
              (c.unread ? '<span class="h-1.5 w-1.5 shrink-0 rounded-full bg-primary"></span>' : '') +
              '<span class="ml-auto shrink-0 text-[11px] text-muted-foreground tnum">' + c.time + '</span>' +
            '</span>' +
            '<span class="block text-xs leading-snug text-muted-foreground line-clamp-2">' + c.snippet + '</span>' +
            '<span class="mt-1.5 flex flex-wrap gap-1">' +
              c.tags.map(function (t) {
                return '<span class="inline-flex items-center rounded border px-1.5 py-0.5 text-[10px] font-medium ' + TAG[t[1]] + '">' + t[0] + '</span>';
              }).join('') +
            '</span>' +
          '</span>' +
        '</button>';
    });
  });

  document.getElementById('convList').innerHTML = html;
}

/* ============================================================
   Thread pane
   ============================================================ */
function renderThread() {
  const c = CONVERSATIONS.find(x => x.id === activeId);
  const chanLabel = { chat: 'Website chat', voice: 'Voice call', email: 'Email' }[c.channel];

  /* header */
  document.getElementById('threadHead').innerHTML =
    '<div class="flex h-14 shrink-0 items-center gap-3 border-b border-border bg-background px-5">' +
      '<div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-muted text-xs font-semibold ' +
        (c.anonymous ? 'text-muted-foreground' : 'text-foreground') + '">' + c.initials + '</div>' +
      '<div class="min-w-0">' +
        '<div class="truncate text-sm font-semibold leading-tight">' + c.name + '</div>' +
        '<div class="truncate text-xs text-muted-foreground">' + c.vehicle + ' · ' + chanLabel + ' · ' + c.source + '</div>' +
      '</div>' +
      '<div class="ml-auto flex shrink-0 items-center gap-2">' +
        '<button class="inline-flex h-8 items-center rounded-md px-2.5 text-xs font-medium text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">Snooze</button>' +
        '<button class="inline-flex h-8 items-center rounded-md border border-input bg-background px-2.5 text-xs font-medium transition-colors hover:bg-accent">Assign</button>' +
        '<button class="inline-flex h-8 items-center rounded-md border border-input bg-background px-2.5 text-xs font-medium transition-colors hover:bg-accent">Mark done</button>' +
        '<button onclick="toggleRail()" title="Toggle details" class="hidden xl:inline-flex h-8 w-8 items-center justify-center rounded-md border border-input bg-background text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">' +
          '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg>' +
        '</button>' +
      '</div>' +
    '</div>';

  /* banner */
  const b = c.banner;
  let bannerHtml = '';
  if (takenOver) {
    bannerHtml =
      '<div class="flex shrink-0 flex-wrap items-center gap-3 bg-primary px-5 py-3 text-primary-foreground">' +
        '<svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>' +
        '<div><div class="text-sm font-medium">You are replying as Riverside Auto</div>' +
        '<div class="text-xs opacity-80">Liner is paused on this conversation and will not send anything.</div></div>' +
        '<button onclick="handBack()" class="ml-auto inline-flex h-8 items-center rounded-md border border-white/30 bg-white/15 px-3 text-xs font-medium transition-colors hover:bg-white/25">Hand back to Liner</button>' +
      '</div>';
  } else if (b) {
    const tone = {
      destructive: ['bg-destructive/10 border-destructive/20 text-destructive', 'text-destructive'],
      warning:     ['bg-warning/10 border-warning/20 text-warning', 'text-warning'],
      primary:     ['bg-primary/10 border-primary/20 text-primary', 'text-primary']
    }[b.tone];
    bannerHtml =
      '<div class="flex shrink-0 flex-wrap items-center gap-3 border-b px-5 py-3 ' + tone[0] + '">' +
        ICON.alert +
        '<div><div class="text-sm font-medium">' + b.title + '</div>' +
        '<div class="text-xs opacity-80">' + b.sub + '</div></div>' +
        '<button onclick="takeOver()" class="ml-auto inline-flex h-8 items-center rounded-md bg-primary px-3 text-xs font-medium text-primary-foreground transition-opacity hover:opacity-90">' + c.composer.cta + '</button>' +
      '</div>';
  }
  document.getElementById('threadBanner').innerHTML = bannerHtml;

  /* messages */
  let body = '<div class="mx-auto flex max-w-3xl flex-col gap-1">';
  c.thread.forEach(function (m) {
    if (m.t === 'day') {
      body += '<div class="my-3 self-center rounded-full bg-muted px-3 py-1 text-[11px] font-medium text-muted-foreground">' + m.text + '</div>';
    } else if (m.t === 'sys' || m.t === 'sys-alert') {
      const alert = m.t === 'sys-alert';
      body += '<div class="my-2 flex max-w-[90%] items-start gap-2 self-center rounded-md border px-3 py-2 text-xs ' +
        (alert ? 'border-destructive/25 bg-destructive/5 text-destructive' : 'border-border bg-background text-muted-foreground') + '">' +
        (alert ? ICON.alert : ICON.box) + '<span>' + m.text + '</span></div>';
    } else if (m.t === 'them') {
      body += '<div class="mt-2 max-w-[80%] self-start rounded-lg rounded-bl-sm border border-border bg-background px-3.5 py-2.5 text-sm leading-relaxed">' + m.text + '</div>' +
              '<div class="mb-1 self-start text-[11px] text-muted-foreground tnum">' + (m.time || '') + '</div>';
    } else if (m.t === 'liner') {
      body += '<div class="mt-2 max-w-[80%] self-end rounded-lg rounded-br-sm bg-primary px-3.5 py-2.5 text-sm leading-relaxed text-primary-foreground">' + m.text + '</div>' +
              '<div class="mb-1 self-end text-[11px] text-muted-foreground tnum">Liner · ' + (m.time || '') + '</div>';
    } else if (m.t === 'human') {
      body += '<div class="mt-2 max-w-[80%] self-end rounded-lg rounded-br-sm bg-foreground px-3.5 py-2.5 text-sm leading-relaxed text-background">' + m.text + '</div>' +
              '<div class="mb-1 self-end text-[11px] text-muted-foreground tnum">Dana Mercer · ' + (m.time || '') + '</div>';
    }
  });
  body += '</div>';
  document.getElementById('threadBody').innerHTML = body;

  /* composer */
  document.getElementById('composer').innerHTML = takenOver ? writerHtml(c) : lockedHtml(c);

  renderRail(c);
}

function lockedHtml(c) {
  return '<div class="mx-auto flex max-w-3xl items-center gap-3 rounded-lg border border-dashed border-input bg-muted/40 px-4 py-3">' +
    '<span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-md border border-border bg-background text-muted-foreground">' + ICON.lock + '</span>' +
    '<div class="min-w-0"><div class="text-sm font-medium">' + c.composer.locked + '</div>' +
    '<div class="text-xs text-muted-foreground">' + c.composer.sub + '</div></div>' +
    '<button onclick="takeOver()" class="ml-auto inline-flex h-9 shrink-0 items-center rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground transition-opacity hover:opacity-90">' + c.composer.cta + '</button>' +
  '</div>';
}

function writerHtml(c) {
  return '<div class="mx-auto max-w-3xl overflow-hidden rounded-lg border border-input focus-within:border-ring focus-within:ring-1 focus-within:ring-ring">' +
    '<textarea rows="3" placeholder="Reply to ' + c.name + '…" class="w-full resize-none bg-background px-4 py-3 text-sm outline-none placeholder:text-muted-foreground"></textarea>' +
    '<div class="flex items-center gap-2 border-t border-border bg-muted/40 px-3 py-2">' +
      '<span class="text-xs text-muted-foreground">Sending as <b class="font-medium text-foreground">Dana Mercer</b> · ' + c.source + '</span>' +
      '<button class="ml-auto inline-flex h-8 items-center rounded-md border border-input bg-background px-3 text-xs font-medium transition-colors hover:bg-accent">Save as note</button>' +
      '<button class="inline-flex h-8 items-center rounded-md bg-primary px-3 text-xs font-medium text-primary-foreground transition-opacity hover:opacity-90">Send reply</button>' +
    '</div>' +
  '</div>';
}

/* ============================================================
   Context rail
   ============================================================ */
function renderRail(c) {
  const r = c.rail;
  let html = '';

  html += '<div class="border-b border-border p-5">' +
    '<div class="text-base font-semibold leading-tight">' + c.name + '</div>' +
    '<div class="mb-3 mt-0.5 text-xs text-muted-foreground">' + r.leadId + '</div>' +
    r.contact.map(function (k) {
      const p = k.prov ? PROV[k.prov] : null;
      return '<div class="flex items-center gap-2 py-1 text-sm">' + ICON[k.icon] +
        '<span class="truncate ' + (k.value === 'Not given' ? 'text-muted-foreground' : '') + '">' + k.value + '</span>' +
        (p ? '<span class="ml-auto shrink-0 rounded border border-border px-1.5 py-0.5 text-[10px] text-muted-foreground">' + p.label + '</span>' : '') +
      '</div>';
    }).join('') +
  '</div>';

  if (r.vehicle) {
    html += '<div class="border-b border-border p-5">' +
      '<div class="mb-3 text-xs font-medium text-muted-foreground">Vehicle of interest</div>' +
      '<div class="flex gap-3">' +
        '<div class="flex h-12 w-16 shrink-0 items-center justify-center rounded-md border border-border bg-muted">' + ICON.car + '</div>' +
        '<div class="min-w-0"><div class="text-sm font-medium leading-snug">' + r.vehicle.name + '</div>' +
        '<div class="mt-0.5 text-xs leading-relaxed text-muted-foreground">' + r.vehicle.meta + '</div>' +
        '<div class="mt-1 text-sm font-semibold tnum">' + r.vehicle.price + '</div></div>' +
      '</div>' +
    '</div>';
  }

  html += '<div class="border-b border-border p-5">' +
    '<div class="mb-3 flex items-center gap-1.5 text-xs font-medium text-muted-foreground">Captured by Liner ' +
      '<span class="text-success">' + ICON.check + '</span></div>' +
    '<div class="space-y-1.5">' +
      r.captured.map(function (row) {
        const p = row[2] ? PROV[row[2]] : null;
        const soft = p && p.soft;
        return '<div class="flex items-baseline gap-2 text-sm">' +
          '<span class="w-[70px] shrink-0 text-xs text-muted-foreground">' + row[0] + '</span>' +
          '<span class="min-w-0 flex-1 ' + (soft ? 'italic text-muted-foreground' : '') + '">' + row[1] + '</span>' +
          (soft
            ? '<button title="Correct this" class="inline-flex shrink-0 items-center gap-1 rounded border border-warning/30 bg-warning/10 px-1.5 py-0.5 text-[10px] font-medium text-warning">' + p.label + ICON.pencil + '</button>'
            : '') +
        '</div>';
      }).join('') +
    '</div>' +
    '<p class="mt-3 text-[11px] leading-relaxed text-muted-foreground">Italic fields were inferred, not stated. Check before using them on a call.</p>' +
  '</div>';

  html += '<div class="border-b border-border p-5">' +
    '<div class="mb-2 text-xs font-medium text-muted-foreground">Assigned to</div>' +
    '<select class="h-9 w-full rounded-md border border-input bg-background px-2.5 text-sm outline-none focus:border-ring focus:ring-1 focus:ring-ring">' +
      ['Unclaimed — in the pool','Dana Mercer (you)','Marcus Idowu — finance','Jess Rowe','Tomas Vega']
        .map(function (o) { return '<option' + (o === r.assigned ? ' selected' : '') + '>' + o + '</option>'; }).join('') +
    '</select>' +
  '</div>';

  html += '<div class="border-b border-border p-5">' +
    '<div class="mb-3 text-xs font-medium text-muted-foreground">History</div>' +
    '<div class="relative space-y-3 pl-4">' +
      '<span class="absolute left-[3px] top-1.5 bottom-1.5 w-px bg-border"></span>' +
      r.history.map(function (h) {
        return '<div class="relative">' +
          '<span class="absolute -left-4 top-1.5 h-[7px] w-[7px] rounded-full ring-2 ring-background ' + (h[2] ? 'bg-destructive' : 'bg-border') + '"></span>' +
          '<div class="text-sm leading-snug">' + h[0] + '</div>' +
          '<div class="text-[11px] text-muted-foreground tnum">' + h[1] + '</div>' +
        '</div>';
      }).join('') +
    '</div>' +
  '</div>';

  html += '<div class="p-5">' +
    '<div class="mb-2 text-xs font-medium text-muted-foreground">Internal note</div>' +
    '<textarea rows="3" placeholder="Only your team sees this." class="w-full resize-none rounded-md border border-input bg-background px-3 py-2 text-sm outline-none placeholder:text-muted-foreground focus:border-ring focus:ring-1 focus:ring-ring"></textarea>' +
  '</div>';

  document.getElementById('rail').innerHTML = html;
}

/* ============================================================
   Actions
   ============================================================ */
function select(id) {
  activeId = id;
  takenOver = false;
  renderList();
  renderThread();
  document.getElementById('threadBody').scrollTop = 0;
}
function takeOver() {
  takenOver = true;
  renderThread();
  const ta = document.querySelector('#composer textarea');
  if (ta) ta.focus();
}
function handBack() {
  takenOver = false;
  renderThread();
}
function toggleRail() {
  document.getElementById('rail').classList.toggle('xl:block');
}

renderFilters();
renderList();
renderThread();
</script>

</body>
</html>
