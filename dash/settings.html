  <nav class="flex-1 overflow-y-auto scroll-thin px-2 py-3">

    <a href="overview.html" title="Overview"

    <a href="conversations.html" title="Conversations"

      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
      <span class="hidden lg:inline">Conversations</span>
      <span class="hidden lg:inline ml-auto rounded-full bg-destructive px-1.5 py-0.5 text-[10px] font-semibold text-destructive-foreground tnum">3</span>
    </a>

    <a href="leads.html" title="Leads"
       class="mb-0.5 flex items-center gap-2.5 rounded-md px-2.5 py-2 text-sm font-medium text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg>
      <span class="hidden lg:inline">Leads</span>
      <span class="hidden lg:inline ml-auto rounded-full bg-muted px-1.5 py-0.5 text-[10px] font-medium text-muted-foreground tnum">12</span>

    <a href="calendar.html" title="Calendar"
       class="mb-0.5 flex items-center gap-2.5 rounded-md px-2.5 py-2 text-sm font-medium text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span class="hidden lg:inline">Calendar</span>
      <span class="hidden lg:inline ml-auto rounded-full bg-muted px-1.5 py-0.5 text-[10px] font-medium text-muted-foreground tnum">6</span>

    <div class="hidden lg:block px-2 pb-1.5 pt-4 text-xs font-medium text-muted-foreground">Manage</div>
    <div class="lg:hidden my-2 border-t border-border"></div>

    <a href="inventory.html" title="Inventory"
       class="mb-0.5 flex items-center gap-2.5 rounded-md px-2.5 py-2 text-sm font-medium text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-5a2 2 0 012-1h10a2 2 0 012 1l2 5"/><rect x="2" y="12" width="20" height="7" rx="2"/><circle cx="7" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/></svg>
      <span class="hidden lg:inline">Inventory</span>
      <span class="hidden lg:inline ml-auto rounded-full bg-destructive px-1.5 py-0.5 text-[10px] font-semibold text-destructive-foreground tnum">3</span>
    </a>

    <a href="assistant.html" title="Liner setup"
       class="mb-0.5 flex items-center gap-2.5 rounded-md px-2.5 py-2 text-sm font-medium text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
      <span class="hidden lg:inline">Liner setup</span>

    <a href="team.html" title="Team"
       class="mb-0.5 flex items-center gap-2.5 rounded-md px-2.5 py-2 text-sm font-medium text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="hidden lg:inline">Team</span>
    </a>

    <a href="settings.html" title="Settings"
       class="mb-0.5 flex items-center gap-2.5 rounded-md bg-accent px-2.5 py-2 text-sm font-medium text-accent-foreground">
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 110-4h.09A1.65 1.65 0 004.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 3.68 1.65 1.65 0 0010 2.17V2a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0020.32 8c.14.35.4.65.74.85"/></svg>
      <span class="hidden lg:inline">Settings</span>
    </a>
  </nav>

  <div class="border-t border-border p-2 lg:p-3">
    <div class="hidden lg:block rounded-md border border-border bg-background p-3">
      <div class="mb-1 flex items-center gap-2">
        <span class="relative flex h-2 w-2">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-success opacity-60"></span>
          <span class="relative inline-flex h-2 w-2 rounded-full bg-success"></span>
        </span>
        <span class="text-sm font-medium">Liner is answering</span>
      </div>
      <p class="text-xs text-muted-foreground">3 open · replying in ~24s</p>
      <button class="mt-2.5 inline-flex h-8 w-full items-center justify-center rounded-md border border-input bg-background px-3 text-xs font-medium transition-colors hover:border-destructive hover:text-destructive">
        Pause Liner
      </button>
    </div>
    <button title="Pause Liner" class="lg:hidden flex h-9 w-full items-center justify-center rounded-md border border-input text-muted-foreground hover:text-destructive">
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
    </button>

  <div class="flex items-center gap-2.5 border-t border-border p-2 lg:px-4 lg:py-3">
    <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-muted text-xs font-semibold text-muted-foreground">DM</div>
    <div class="hidden lg:block min-w-0">
      <div class="truncate text-sm font-medium leading-tight">Dana Mercer</div>
      <div class="truncate text-xs text-muted-foreground">Sales manager</div>

</aside>

<div class="ml-14 lg:ml-60">
  <header class="sticky top-0 z-30 flex h-14 items-center gap-4 border-b border-border bg-background/95 px-4 backdrop-blur md:px-6">
    <div class="relative w-full max-w-sm">
      <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="search" placeholder="Search settings…"
             class="h-9 w-full rounded-md border border-input bg-background pl-9 pr-3 text-sm outline-none placeholder:text-muted-foreground focus:border-ring focus:ring-1 focus:ring-ring">
    </div>
    <div class="ml-auto flex items-center gap-2">
      <button class="relative inline-flex h-9 w-9 items-center justify-center rounded-md text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-destructive ring-2 ring-background"></span>
      </button>
      <div class="h-5 w-px bg-border"></div>
      <span class="hidden text-sm text-muted-foreground sm:inline tnum">Fri, Jul 31 · 9:12 AM</span>
    </div>
  </header>

  <main class="p-4 md:p-6">

    <div class="mb-4">
      <h1 class="text-2xl font-semibold tracking-tight">Settings</h1>
      <p class="mt-1 text-sm text-muted-foreground">Store details, where leads come in, and what you pay.</p>
    </div>

    <div id="tabs" class="mb-4 flex flex-wrap gap-1.5"></div>
    <div id="panel" class="space-y-4"></div>
  </main>
</div>

<script src="settings-data.js"></script>
<script>
const ICON = {
  copy:'<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>',
  alert:'<svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>'
};

const TABS = [['store','Dealership'],['channels','Channels'],['sources','Lead sources'],['notify','Notifications'],['billing','Billing']];
let tab = 'store';

function card(title, sub, body, action) {
  return '<div class="rounded-lg border border-border bg-card shadow-sm">' +
    '<div class="flex flex-wrap items-center gap-3 border-b border-border p-5">' +
      '<div class="min-w-0"><h3 class="font-semibold leading-none tracking-tight">' + title + '</h3>' +
      (sub ? '<p class="mt-1.5 text-sm text-muted-foreground">' + sub + '</p>' : '') + '</div>' +
      (action ? '<div class="ml-auto">' + action + '</div>' : '') +
    '</div><div class="p-5">' + body + '</div></div>';
}

function field(label, value, wide) {
  return '<div class="' + (wide ? 'sm:col-span-2' : '') + '">' +
    '<label class="mb-1.5 block text-xs font-medium text-muted-foreground">' + label + '</label>' +
    '<input value="' + value + '" class="h-9 w-full rounded-md border border-input bg-background px-2.5 text-sm outline-none focus:border-ring focus:ring-1 focus:ring-ring"></div>';
}

function statusPill(status) {
  const map = {
    live:          ['Live', '#E9F7EE', '#15803D'],
    not_connected: ['Not connected', '#EEF1F5', '#64748B'],
    internal:      ['Built in', '#E8F2FF', '#0062CC'],
    none:          ['By design', '#EEF1F5', '#64748B']
  }[status];
  return '<span class="inline-flex items-center rounded-md px-2 py-0.5 text-xs font-medium" style="background:' + map[1] + ';color:' + map[2] + '">' + map[0] + '</span>';
}

/* ---------- panels ---------- */
function panelStore() {
  let h = card('Dealership', 'Liner uses this in confirmations and directions.',
    '<div class="grid gap-3 sm:grid-cols-2">' +
      field('Store name', DEALER.name) + field('Phone', DEALER.phone) +
      field('Street address', DEALER.address, true) +
      field('City and postcode', DEALER.city) + field('Website', DEALER.website) +
      field('Sales email', DEALER.email) + field('Time zone', DEALER.timezone) +
    '</div>');

  h += card('Opening hours', 'Anything outside these is after-hours, and Liner behaves differently.',
    '<div class="divide-y divide-border">' +
      HOURS.map(function (d) {
        return '<div class="flex flex-wrap items-center gap-3 py-2.5">' +
          '<span class="w-24 shrink-0 text-sm font-medium">' + d[0] + '</span>' +
          (d[3]
            ? '<span class="text-sm tnum">' + d[1] + ' – ' + d[2] + '</span>'
            : '<span class="text-sm text-muted-foreground">Closed</span>') +
          '<label class="ml-auto flex items-center gap-2 text-xs text-muted-foreground">' +
            '<input type="checkbox" ' + (d[3] ? 'checked' : '') + ' class="h-4 w-4 rounded border-input accent-primary">Open</label>' +
        '</div>';
      }).join('') +
    '</div>');
  return h;
}

function panelChannels() {
  let h = card('Where Liner listens', 'Each of these is a way a buyer can reach you.',
    CHANNELS.map(function (c) {
      return '<div class="mb-2 flex flex-wrap items-center gap-3 rounded-md border border-border p-4 last:mb-0">' +
        '<div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="text-sm font-medium">' + c.name + '</span>' + statusPill(c.status) + '</div>' +
        '<div class="mt-0.5 text-xs text-muted-foreground">' + c.detail + '</div>' +
        '<div class="mt-1 text-xs text-muted-foreground">' + c.meta + '</div></div>' +
        '<button class="shrink-0 inline-flex h-8 items-center rounded-md border border-input bg-background px-3 text-xs font-medium transition-colors hover:bg-accent">' +
          (c.status === 'live' ? 'Configure' : 'Set up') + '</button>' +
      '</div>';
    }).join(''));

  h += card('Widget embed code', 'Paste this before the closing body tag on every page of your site.',
    '<pre class="overflow-x-auto rounded-md border border-border bg-muted/40 p-3 font-mono text-xs leading-relaxed">' + EMBED.replace(/</g,'&lt;') + '</pre>' +
    '<p class="mt-3 text-xs text-muted-foreground">Already detected on riversideauto.com. Reinstalling is harmless.</p>',
    '<button class="inline-flex h-9 items-center gap-2 rounded-md border border-input bg-background px-3 text-sm font-medium transition-colors hover:bg-accent">' + ICON.copy + 'Copy</button>');

  h += card('Integrations', null,
    INTEGRATIONS.map(function (i) {
      return '<div class="mb-2 flex flex-wrap items-center gap-3 rounded-md border border-border p-4 last:mb-0">' +
        '<div class="min-w-0 flex-1"><div class="flex items-center gap-2"><span class="text-sm font-medium">' + i.name + '</span>' + statusPill(i.status) + '</div>' +
        '<div class="mt-0.5 text-xs text-muted-foreground">' + i.detail + '</div>' +
        '<div class="mt-1 text-xs text-muted-foreground">' + i.meta + '</div></div></div>';
    }).join(''));
  return h;
}

function panelSources() {
  const spend = SOURCES.reduce((n, s) => n + s.leads * s.cost, 0);
  const leads = SOURCES.reduce((n, s) => n + s.leads, 0);

  let h = '<div class="grid gap-4 sm:grid-cols-3">' +
    [['Paid leads this month', leads, ''],
     ['Spent acquiring them', '$' + spend.toLocaleString('en-US'), ''],
     ['What Liner costs', '$2,000', 'flat, all channels']].map(function (s) {
      return '<div class="rounded-lg border border-border bg-card p-4 shadow-sm">' +
        '<div class="text-xs font-medium text-muted-foreground">' + s[0] + '</div>' +
        '<div class="mt-1 flex items-baseline gap-2"><span class="text-2xl font-bold tnum">' + s[1] + '</span>' +
        (s[2] ? '<span class="text-xs text-muted-foreground">' + s[2] + '</span>' : '') + '</div></div>';
    }).join('') + '</div>';

  h += card('Marketplaces', 'These arrive with a name and phone already attached, and Liner makes first contact.',
    '<div class="overflow-x-auto scroll-thin"><table class="w-full text-sm"><thead><tr class="border-b border-border">' +
      ['Source','Status','Leads this month','Cost per lead','Spend','How it arrives'].map(function (x) {
        return '<th class="h-10 whitespace-nowrap px-3 text-left font-medium text-muted-foreground first:pl-0">' + x + '</th>'; }).join('') +
      '<th class="h-10 w-10"></th></tr></thead><tbody>' +
      SOURCES.map(function (s) {
        return '<tr class="border-b border-border last:border-0">' +
          '<td class="py-3 pr-3 font-medium">' + s.name + '</td>' +
          '<td class="whitespace-nowrap px-3 py-3">' + statusPill(s.status) + '</td>' +
          '<td class="px-3 py-3 tnum">' + (s.leads || '—') + '</td>' +
          '<td class="px-3 py-3 tnum text-muted-foreground">' + (s.cost ? '$' + s.cost : '—') + '</td>' +
          '<td class="px-3 py-3 tnum">' + (s.leads ? '$' + (s.leads * s.cost).toLocaleString('en-US') : '—') + '</td>' +
          '<td class="whitespace-nowrap px-3 py-3 text-xs text-muted-foreground">' + s.meta + '</td>' +
          '<td class="py-3 text-right"><button class="inline-flex h-8 items-center rounded-md border border-input bg-background px-3 text-xs font-medium transition-colors hover:bg-accent">' +
            (s.status === 'live' ? 'Edit' : 'Connect') + '</button></td></tr>';
      }).join('') +
    '</tbody></table></div>');
  return h;
}

function panelNotify() {
  return card('When the store gets told', 'Per-person channels are set on the Team page. These are the store-wide rules.',
    '<div class="overflow-x-auto scroll-thin"><table class="w-full text-sm"><thead><tr class="border-b border-border">' +
      '<th class="h-10 pr-3 text-left font-medium text-muted-foreground">Event</th>' +
      '<th class="h-10 px-3 text-left font-medium text-muted-foreground">Timing</th>' +
      '<th class="h-10 px-3 text-left font-medium text-muted-foreground">Goes out as</th>' +
      '<th class="h-10 w-10"></th></tr></thead><tbody>' +
      NOTIFY_RULES.map(function (r) {
        return '<tr class="border-b border-border last:border-0">' +
          '<td class="py-3 pr-3">' + r[0] + '</td>' +
          '<td class="whitespace-nowrap px-3 py-3 text-muted-foreground">' + r[1] + '</td>' +
          '<td class="whitespace-nowrap px-3 py-3 text-muted-foreground">' + r[2] + '</td>' +
          '<td class="py-3 text-right"><button class="inline-flex h-8 items-center rounded-md border border-input bg-background px-3 text-xs font-medium transition-colors hover:bg-accent">Edit</button></td></tr>';
      }).join('') +
    '</tbody></table></div>');
}

function panelBilling() {
  let h = card('Plan', null,
    '<div class="flex flex-wrap items-start gap-4">' +
      '<div class="min-w-0 flex-1"><div class="text-sm font-medium">' + BILLING.plan + '</div>' +
      '<div class="mt-0.5 text-xs text-muted-foreground">' + BILLING.cycle + ' · next charge ' + BILLING.next + '</div>' +
      '<div class="mt-3 text-xs text-muted-foreground">Paying with ' + BILLING.method + '</div></div>' +
      '<div class="text-right"><div class="text-3xl font-bold tnum">$' + BILLING.price.toLocaleString('en-US') + '</div>' +
      '<div class="text-xs text-muted-foreground">per month, flat</div></div>' +
    '</div>' +
    '<div class="mt-4 flex flex-wrap gap-2 border-t border-border pt-4">' +
      '<button class="inline-flex h-9 items-center rounded-md border border-input bg-background px-3 text-sm font-medium transition-colors hover:bg-accent">Update payment method</button>' +
      '<button class="inline-flex h-9 items-center rounded-md border px-3 text-sm font-medium" style="border-color:#FECACA;color:#DC2626">Cancel plan</button>' +
    '</div>');

  h += card('Invoices', null,
    '<div class="overflow-x-auto scroll-thin"><table class="w-full text-sm"><thead><tr class="border-b border-border">' +
      '<th class="h-10 pr-3 text-left font-medium text-muted-foreground">Date</th>' +
      '<th class="h-10 px-3 text-left font-medium text-muted-foreground">Amount</th>' +
      '<th class="h-10 px-3 text-left font-medium text-muted-foreground">Status</th>' +
      '<th class="h-10 w-10"></th></tr></thead><tbody>' +
      BILLING.invoices.map(function (i) {
        return '<tr class="border-b border-border last:border-0">' +
          '<td class="py-3 pr-3 tnum">' + i[0] + '</td>' +
          '<td class="px-3 py-3 tnum">$' + i[1].toLocaleString('en-US') + '</td>' +
          '<td class="px-3 py-3"><span class="text-xs text-muted-foreground">' + i[2] + '</span></td>' +
          '<td class="py-3 text-right"><button class="inline-flex h-8 items-center rounded-md border border-input bg-background px-3 text-xs font-medium transition-colors hover:bg-accent">PDF</button></td></tr>';
      }).join('') +
    '</tbody></table></div>');
  return h;
}

function render() {
  document.getElementById('tabs').innerHTML = TABS.map(function (t) {
    const on = t[0] === tab;
    return '<button onclick="setTab(\'' + t[0] + '\')" class="inline-flex items-center rounded-md border px-3 py-1.5 text-sm font-medium transition-colors ' +
      (on ? 'border-foreground bg-foreground text-background' : 'border-input bg-background text-muted-foreground hover:bg-accent hover:text-accent-foreground') +
      '">' + t[1] + '</button>';
  }).join('');

  document.getElementById('panel').innerHTML =
    tab === 'store' ? panelStore() :
    tab === 'channels' ? panelChannels() :
    tab === 'sources' ? panelSources() :
    tab === 'notify' ? panelNotify() : panelBilling();
}
function setTab(t) { tab = t; render(); }
render();
</script>


</body>
